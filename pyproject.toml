[project]
name = "mac-ai-image-studio"
version = "0.2.0"
description = "Mac (M series) AI Image Studio - Based on Qwen Image 2.1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ottocheng" }]
dependencies = [
    "accelerate>=0.33.0",
    "diffusers @ git+https://github.com/huggingface/diffusers",
    "gradio>=4.44.0",
    "safetensors>=0.4.0",
    "sdnq>=0.2.2", # registers SDNQ quantization with diffusers; needed for the SDNQ-quantized Qwen checkpoint
    "torch>=2.3.0",
    "torchvision>=0.29.2", # required by the Qwen3-VL processor
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
